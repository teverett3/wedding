name: Update wedding photos

on:
  schedule:
    # Hourly is more reliable than every 15 minutes on GitHub-hosted runners
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-wedding-photos
  cancel-in-progress: true

jobs:
  update-photos:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch iCloud album
        run: node scripts/fetch-icloud-photos.js

      - name: Commit and push photos.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add photos.json
          if git diff --staged --quiet; then
            echo "No photo changes to commit"
            exit 0
          fi
          git commit -m "Update wedding photos from iCloud album"
          git push
